[workspace]
members = ["languages/fmea", "harness", "crates/intersect-views", "crates/intersect-view-host", "crates/intersect-view-engine"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
intersect-load = { git = "https://github.com/mercurio-labs/intersect-text.git", rev = "69e2303c7f3ce57c189ea2d8856f54ade1cab0be" }
intersect-view-engine = { path = "crates/intersect-view-engine" }
intersect-view-host = { path = "crates/intersect-view-host" }
intersect-views = { path = "crates/intersect-views" }
serde = { version = "1.0.228", features = ["derive"] }
intersect-model = "=0.1.0-alpha.2"
intersect-text = "=0.1.0-alpha.2"
intersect-build-support = "=0.1.0-alpha.2"
serde_json = "1.0.149"
self_cell = "=1.3.0"
sha2 = "0.10.9"

# Match Text's own Model/build-support pin so all runtime types share identity.
[patch.crates-io]
intersect-model = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "11c33990a50cb4074d4f97619687a6b33358e560" }
intersect-build-support = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "11c33990a50cb4074d4f97619687a6b33358e560" }
intersect-text = { git = "https://github.com/mercurio-labs/intersect-text.git", rev = "69e2303c7f3ce57c189ea2d8856f54ade1cab0be" }

[profile.test-fast]
inherits = "dev"
opt-level = 1
debug = 0
incremental = true

[profile.test-fast.package."*"]
opt-level = 3
